[pytest]
# Minimal on purpose: the documented command line keeps working unchanged.
testpaths = tests
markers =
    allow_network: the test may open non-loopback network connections (see tests/conftest.py no_network)
filterwarnings =
    # An exception that escapes a Python thread fails the test that ran it
    # (pytest reports it as this warning); it must never go unnoticed.
    error::pytest.PytestUnhandledThreadExceptionWarning
