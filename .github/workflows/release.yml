name: Windows MSI release

# Started by scripts/publish-release.ps1, which pushes a tag vX.Y.Z.
# Two jobs, so that the code under test never runs with write access:
#   build   - read-only token, no persisted Git credentials: checks the tag,
#             runs the tests (two processes), builds the executable and the MSI, uploads it
#             as a workflow artifact;
#   publish - write access, runs no project code: downloads the artifact and
#             creates the GitHub Release of the tag.
# The YOLO weights are not in Git: tools/fetch_model_weights.py downloads them
# from the permanent GitHub release «models» (before the tests, into a folder
# outside the checkout) and verifies their size and SHA-256 against
# packaging/model-weights.json; after the tests they are placed in models/ and
# the build ships exactly those files (-IncludeYoloModel; licenses in
# THIRD_PARTY_NOTICES.md). The tag reaches
# the scripts only through the TAG environment variable, never interpolated
# into a script.
#
# Actions are pinned to the commits resolved from their official major tags.
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    # The bounded steps add up to 145 min (fetch 30, install 20, two test halves
    # 45 + 45, place 5); the build step has no limit of its own and took 6.5 min
    # on 2026-10-28. 180 keeps 35 min for it in the worst case.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # pip's download cache (review 2026-10-29, K5), keyed on every file a
      # pip install of this job reads, build-windows.ps1's build.txt included.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/yolo.txt
            requirements/build.txt
            requirements/release-constraints.txt

      - name: Check that the tag matches the program version
        shell: pwsh
        run: |
          $text = Get-Content kicadgen/__init__.py -Raw
          $version = [regex]::Match($text, '__version__\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match kicadgen.__version__ $version."
          }

      # Before the 22-minute test run, so an unreachable asset fails the job
      # in minutes (review 2026-10-29, K4), and with a bounded retry for a
      # transient network error (exit 1). Exit 2 (wrong size or SHA-256, bad
      # manifest) is permanent and not retried. The weights wait OUTSIDE the
      # checkout: the tests must run without them, exactly as in tests.yml.
      - name: Fetch the model weights
        shell: pwsh
        timeout-minutes: 30
        env:
          WEIGHTS_STAGING: ${{ runner.temp }}/model-weights
        run: |
          # Standard library only; a file whose size or SHA-256 differs from
          # the manifest fails the build, so a replaced asset never ships.
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python tools/fetch_model_weights.py --target $env:WEIGHTS_STAGING
            $status = $LASTEXITCODE
            if ($status -eq 0) { break }
            if ($status -ne 1 -or $attempt -eq $attempts) {
              throw "Model weights not fetched (exit $status, attempt $attempt of $attempts)."
            }
            Write-Host "Attempt $attempt of $attempts failed (exit $status); retrying in 30 s."
            Start-Sleep -Seconds 30
          }

      - name: Install the test dependencies
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements/yolo.txt `
            -c requirements/release-constraints.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)." }
          # PyYAML: tests/test_ci_workflows.py reads these workflow files; without
          # it those checks were skipped in the release build (audit 138, D10).
          python -m pip install --disable-pip-version-check -q pyyaml
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)." }

      # The suite runs in two processes, split at tests/test_photo_detector_ui.py
      # by tools/run_test_halves.py: in a single process it can die at random
      # with a native Qt/VTK fail-fast (HANDOFF point 113). Each half has its
      # own timeout so a hang cannot hold the runner for hours.
      - name: Run the test suite (first half)
        shell: pwsh
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # The test watchdog writes the stacks of a hang or native crash to
          # %TEMP%\kicadgen-test-hang-<pid>.txt (tests/conftest.py): TEMP is
          # pinned to the runner's temp folder so the step below can upload it.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python tools/run_test_halves.py first
          if ($LASTEXITCODE -ne 0) { throw "Tests failed, first half ($LASTEXITCODE)." }

      - name: Run the test suite (second half)
        shell: pwsh
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # The test watchdog writes the stacks of a hang or native crash to
          # %TEMP%\kicadgen-test-hang-<pid>.txt (tests/conftest.py): TEMP is
          # pinned to the runner's temp folder so the step below can upload it.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python tools/run_test_halves.py second
          if ($LASTEXITCODE -ne 0) { throw "Tests failed, second half ($LASTEXITCODE)." }

      - name: Upload the test hang report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-hang-report
          path: ${{ runner.temp }}/kicadgen-test-hang-*.txt
          if-no-files-found: ignore

      # build-windows.ps1 -IncludeYoloModel verifies them again (size and
      # SHA-256) and ships exactly the manifest's files.
      - name: Place the model weights
        shell: pwsh
        timeout-minutes: 5
        env:
          WEIGHTS_STAGING: ${{ runner.temp }}/model-weights
        run: |
          python -c "import shutil, sys; shutil.copytree(sys.argv[1], 'models', dirs_exist_ok=True)" $env:WEIGHTS_STAGING
          if ($LASTEXITCODE -ne 0) { throw "Model weights not placed ($LASTEXITCODE)." }

      - name: Build the executable and the MSI
        shell: pwsh
        env:
          # Needed only when WiX 3.14 is not on the runner: SHA-256 of
          # wix314-binaries.zip, set by the maintainer as a repository
          # variable. Without it the download is refused (fail closed).
          KICADGEN_WIX_SHA256: ${{ vars.WIX314_SHA256 }}
        run: ./scripts/build-windows.ps1 -Package msi -IncludeYoloModel

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-msi
          path: dist

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.msi --repo "$GITHUB_REPOSITORY" \
            --title "KiCadGen $TAG" --generate-notes
