name: Tests

# Runs the test suite on every branch push and pull request, with the same Python and
# the same pinned dependencies as the release build (release.yml), on the same
# Windows runner. FreeCAD, KiCad and the git-ignored model weights are not
# installed: the suite must not depend on them. Tests of the generation flow
# fake the FreeCAD probe (tests/qt_fixtures.py), tests of glyph geometry read
# the suite's own symbol library (tests/data/glyph_fixture.kicad_sym), tests
# that would need a detector model choose the AI detector, and a test whose
# subject IS the external program (kicad-cli, FreeCAD) skips with the reason
# (see .claude/skills/ci-green). Read-only token, no persisted Git
# credentials, no secrets.
# The suite runs in two processes (tools/run_test_halves.py, HANDOFF point 113)
# and every step has a timeout.
#
# Actions use the same immutable commits as release.yml.
#
# Branch pushes only, never tag pushes (review 2026-10-29, K2): the tag vX.Y.Z
# points at a commit the branch push has already tested, and release.yml runs
# the suite again on the tag, so a tag run was a third copy. With only
# `branches` given, GitHub does not start the workflow for any tag push.
# scripts/publish-release.ps1 looks for a green run of the commit on any
# branch, which the branch push still produces.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # Larger than the sum of the step limits (20 + 45 + 45), so a step limit,
    # never the job limit, is what stops a slow step.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # pip's download cache, keyed on the files the install step reads
      # (review 2026-10-29, K5): pinned versions, so a key change means a
      # real dependency change.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/yolo.txt
            requirements/release-constraints.txt

      - name: Install the test dependencies
        id: install
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements/yolo.txt `
            -c requirements/release-constraints.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)." }
          # PyYAML: tests/test_ci_workflows.py reads these workflow files.
          python -m pip install --disable-pip-version-check -q pyyaml
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)." }

      - name: Run the test suite (first half)
        shell: pwsh
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # The test watchdog writes the stacks of a hang or native crash to
          # %TEMP%\kicadgen-test-hang-<pid>.txt (tests/conftest.py): TEMP is
          # pinned to the runner's temp folder so the step below can upload it.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python tools/run_test_halves.py first
          if ($LASTEXITCODE -ne 0) { throw "Tests failed, first half ($LASTEXITCODE)." }

      # Runs even when the first half failed, so one run shows the whole suite,
      # but never after a failed install (nothing to test with).
      - name: Run the test suite (second half)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          # The test watchdog writes the stacks of a hang or native crash to
          # %TEMP%\kicadgen-test-hang-<pid>.txt (tests/conftest.py): TEMP is
          # pinned to the runner's temp folder so the step below can upload it.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python tools/run_test_halves.py second
          if ($LASTEXITCODE -ne 0) { throw "Tests failed, second half ($LASTEXITCODE)." }

      # A hang or a native crash ends the run with a bare exit code; the
      # watchdog's stack report says which test was running (audit 138, D6).
      - name: Upload the test hang report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-hang-report
          path: ${{ runner.temp }}/kicadgen-test-hang-*.txt
          if-no-files-found: ignore
